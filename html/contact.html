<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/paginaEjemplo/css/gallery.css">
    <link rel="stylesheet" href="/paginaEjemplo/css/general.css">
    <link rel="stylesheet" href="/paginaEjemplo/css/styles.css">
    <link rel="stylesheet" href="/paginaEjemplo/css/contact.css">
</head>

<body>

    <header>
        <nav class="menu">
            <img src="/paginaEjemplo/images/petroleo (1).png" alt="" class="menu__logo">

            <ul class="menu__list">
                <li>
                    <a href="/paginaEjemplo/index.html" class="menu__link"> Home
                    </a>
                </li>
                <li>
                    <a href="/paginaEjemplo/html/gallery.html" class="menu__link"> Gallery
                    </a>
                </li>
                <li>
                    <a href="/paginaEjemplo/html/contact.html" class="menu__link"> Contact
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main>

        <form>
            <div class="field">
                <label for="name">Nombre:</label>
                <input type="text" id="name" placeholder="Tu Nombre" required>
            </div>

            <div class="field">
                <label for="email">Correo:</label>
                <input type="email" id="email" placeholder="ejemplo@ejemplo.com" required>
            </div>

            <div class="field">
                <label for="Mensaje">Mensaje:</label>
                <input type="text" id="Mensaje" placeholder="Pregunta lo que quieras" required>
            </div>

            <div class="field">
                <button>ENVIAR</button>
            </div>

        </form>

    </main>

    <footer>
        <div class="footer__image">

            <img src="/paginaEjemplo/images/github.png" alt="github icon" class="img">
            <img src="/paginaEjemplo/images/linkedin.png" alt="linkedin icon" class="img">
            <img src="/paginaEjemplo/images/X.png" alt="X icon" class="img">

        </div>
        <p> todos los derechos reservados - 2026</p>
    </footer>

</body>

</html>
